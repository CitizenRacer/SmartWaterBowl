name: Replace load-cell STL files once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ChatGPT_replace_loadcell_stls_once.yml"

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct repaired STL files
        shell: bash
        run: |
          set -euo pipefail

          cat \
            ".github/ChatGPT_loadcell_stl_payload/versionf.part1" \
            ".github/ChatGPT_loadcell_stl_payload/versionf.part2" \
            ".github/ChatGPT_loadcell_stl_payload/versionf.part3" \
            | base64 --decode \
            | xz --decompress --stdout \
            > "hardware/Loadcell Brackets/50kgLoadcell-VersionF.stl"

          cat \
            ".github/ChatGPT_loadcell_stl_payload/versionf2021.part1" \
            ".github/ChatGPT_loadcell_stl_payload/versionf2021.part2" \
            ".github/ChatGPT_loadcell_stl_payload/versionf2021.part3" \
            | base64 --decode \
            | xz --decompress --stdout \
            > "hardware/Loadcell Brackets/50kgLoadcell-VersionF-2021.stl"

          echo "73f9e0e58b2eadeb6d3ab9ccc7f48f0e042abcc2dd630169f9c93649b0c72bc9  hardware/Loadcell Brackets/50kgLoadcell-VersionF.stl" | sha256sum --check
          echo "9ca00359d31d09008c6e275e37923ac601c75bb41de67eace60470a880343ef3  hardware/Loadcell Brackets/50kgLoadcell-VersionF-2021.stl" | sha256sum --check

      - name: Commit repaired STL replacements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "hardware/Loadcell Brackets/50kgLoadcell-VersionF.stl"
          git add "hardware/Loadcell Brackets/50kgLoadcell-VersionF-2021.stl"
          git rm -r ".github/ChatGPT_loadcell_stl_payload"
          git rm ".github/workflows/ChatGPT_replace_loadcell_stls_once.yml"
          git commit -m "Replace load-cell brackets with repaired STL files"
          git push
